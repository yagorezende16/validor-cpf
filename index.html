<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Validador de CPF online e gratuito. Verifique a validade de um CPF de forma rápida e simples.">
  <meta name="keywords" content="validador de cpf, validar cpf, verificar cpf, algoritmo cpf">
  <title>Validador de CPF - Verificação Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Validador de CPF</h1>
    <p>Digite o seu CPF para verificar:</p>
    <input type="text" id="cpfInput" placeholder="000.000.000-00">
    <button id="btnValidar">Verificar CPF</button>
    <p id="mensagem" class="mensagem"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
